name: Deploy to Environment

# Replaces CircleCI orb job: hmpps/deploy_env
# Used by: hmpps-digital-prison-reporting-mi
#
# CircleCI source equivalent (hmpps-circleci-orb src/jobs/deploy_env.yml):
#   deploy_env:
#     executor: default_small
#     steps:
#       - checkout
#       - k8s_setup           (authenticates to Cloud Platform k8s cluster)
#       - install_helm
#       - install_aws_cli
#       - recall: APP_VERSION
#       - show changelog (optional)
#       - run: helm upgrade/install via deploy_env.sh
#       - slack/notify (if slack_notification: true)
#       - jira/notify  (if jira_update: true)
#
# k8s secrets required (auto-populated by Cloud Platform Terraform module):
#   KUBE_CERT, KUBE_CLUSTER, KUBE_NAMESPACE, KUBE_TOKEN
#
# IP allowlist groups (published org-wide as Actions VARIABLES by
# ministryofjustice/hmpps-ip-allowlists publish.yml):
#   vars.HMPPS_IP_ALLOWLIST_GROUPS_YAML_GZ, vars.HMPPS_IP_ALLOWLIST_GROUPS_VERSION
# Without these, allowlist.groups in values-*.yaml do not expand to CIDRs and
# nginx returns 403 for VPN users (port-forward still works).
#
# Approval gates (CircleCI type: approval) are handled by GitHub Environment
# required reviewers — no extra workflow step needed.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment name — must match a GitHub Environment
        type: string
        required: true
      app-version:
        description: Docker image tag / app version to deploy (Build.<sha>)
        type: string
        required: true
      helm-chart-name:
        description: Helm chart directory name inside helm-dir
        type: string
        default: ''
      release-name:
        description: Helm release name
        type: string
        default: ''
      helm-dir:
        description: Directory containing helm charts
        type: string
        default: 'helm_deploy'
      helm-additional-args:
        description: Extra arguments passed to helm upgrade
        type: string
        default: ''
      # Optional YAML from a releases-board config/values.yaml (written to a
      # temp file and passed as an extra --values).
      release-values-yaml:
        description: Extra Helm values YAML content
        type: string
        default: ''
      helm-timeout:
        description: Helm upgrade --timeout value
        type: string
        default: '5m'
      show-changelog:
        description: Display version history before deploying
        type: boolean
        default: true
      slack-notification:
        description: Send Slack notification on deploy result
        type: string
        default: 'false'
      slack-channel:
        description: Slack channel for notifications
        type: string
        default: 'dpr_cicd_approvals'

    secrets:
      KUBE_CERT:
        required: true
      KUBE_CLUSTER:
        required: true
      KUBE_NAMESPACE:
        required: true
      KUBE_TOKEN:
        required: true
      HMPPS_SRE_SLACK_BOT_TOKEN:
        required: false
      NONPROD_RELEASES_SLACK_CHANNEL:
        required: false
      PROD_RELEASES_SLACK_CHANNEL:
        required: false
      # Optional PAT/App token that can read ministryofjustice/hmpps-ip-allowlists,
      # used as a fallback when org var HMPPS_IP_ALLOWLIST_GROUPS_YAML_GZ is
      # unavailable. The allowlist itself comes from org Actions VARIABLES
      # (vars.HMPPS_IP_ALLOWLIST_GROUPS_YAML_GZ) — no secret needed normally.
      IP_ALLOWLISTS_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The environment: key is what replaces CircleCI type: approval gates.
    # When the GitHub Environment has required reviewers configured,
    # GHA pauses here automatically until a reviewer approves.
    environment: ${{ inputs.environment }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      # ── Resolve chart and release names ──────────────────────────────
      # Matches CircleCI defaults:
      #   chart_name:   ${CIRCLE_PROJECT_REPONAME}
      #   release_name: PROJECT_NAME
      - name: Resolve chart and release names
        id: names
        run: |
          CHART="${{ inputs.helm-chart-name }}"
          if [ -z "$CHART" ]; then
            CHART="${{ github.event.repository.name }}"
          fi

          RELEASE="${{ inputs.release-name }}"
          if [ -z "$RELEASE" ]; then
            RELEASE="${CHART}-${{ inputs.environment }}"
          fi

          echo "chart=$CHART" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # ── Install Helm ─────────────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: latest

      # ── Install kubectl ──────────────────────────────────────────────
      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      # ── Authenticate to Cloud Platform k8s ───────────────────────────
      # Matches CircleCI: k8s_setup command in hmpps orb
      # Secrets auto-populated by Cloud Platform Terraform module
      - name: Authenticate to Cloud Platform
        run: |
          echo "${{ secrets.KUBE_CERT }}" > /tmp/ca.crt

          kubectl config set-cluster "${{ secrets.KUBE_CLUSTER }}" \
            --certificate-authority=/tmp/ca.crt \
            --server="https://${{ secrets.KUBE_CLUSTER }}"

          kubectl config set-credentials deploy-user \
            --token="${{ secrets.KUBE_TOKEN }}"

          kubectl config set-context deploy \
            --cluster="${{ secrets.KUBE_CLUSTER }}" \
            --user=deploy-user \
            --namespace="${{ secrets.KUBE_NAMESPACE }}"

          kubectl config use-context deploy

      # ── Show changelog (optional) ────────────────────────────────────
      # Matches CircleCI: show_changelog parameter
      - name: Show version history
        if: inputs.show-changelog == true
        run: |
          echo "Deploying version: ${{ inputs.app-version }}"
          echo "Target environment: ${{ inputs.environment }}"
          echo "Chart: ${{ steps.names.outputs.chart }}"
          echo "Release: ${{ steps.names.outputs.release }}"

          CURRENT=$(kubectl get deployment "${{ steps.names.outputs.release }}" \
            -n "${{ secrets.KUBE_NAMESPACE }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            2>/dev/null || echo "not deployed")

          echo "Currently deployed: $CURRENT"

      # ── Build Helm dependencies ──────────────────────────────────────
      - name: Build Helm dependencies
        run: |
          helm dependency build \
            "${{ inputs.helm-dir }}/${{ steps.names.outputs.chart }}"

       # ── Resolve image tag override path ──────────────────────────────
      # Matches CircleCI's deploy_env.sh: charts using generic-service as a
      # dependency need generic-service.image.tag, not image.tag.
      - name: Resolve image tag override path
        id: image-tag
        run: |
          CHART_DIR="${{ inputs.helm-dir }}/${{ steps.names.outputs.chart }}"
          if helm dependency list "$CHART_DIR" | grep -q generic-service; then
            echo "set-arg=generic-service.image.tag" >> "$GITHUB_OUTPUT"
          else
            echo "set-arg=image.tag" >> "$GITHUB_OUTPUT"
          fi

      # ── Optional release-board values ────────────────────────────────
      - name: Write release values override
        id: release-values
        env:
          VALUES: ${{ inputs.release-values-yaml }}
        run: |
          set -euo pipefail
          if [ -n "${VALUES}" ] && echo "${VALUES}" | grep -qvE '^[[:space:]]*(#.*)?$'; then
            printf '%s\n' "${VALUES}" > /tmp/release-values.yaml
            echo "flag=--values /tmp/release-values.yaml" >> "$GITHUB_OUTPUT"
            echo "Using extra release values override"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # ── HMPPS IP allowlist groups (CircleCI deploy_env.sh parity) ─────
      # Expands allowlist.groups (internal, mojvpn, …) into CIDRs on the
      # ingress. Without it nginx returns 403 for VPN users.
      # Composite actions cannot read vars/secrets, so the org variables
      # published by ministryofjustice/hmpps-ip-allowlists are passed in here.
      - name: Prepare IP allowlist groups
        id: allowlist
        uses: ministryofjustice/hmpps-reporting-actions/actions/prepare-ip-allowlist@21ecad84df30d8f03981b2b20106f16976af6b34 # v1.0.4
        with:
          allowlist-yaml-gz: ${{ vars.HMPPS_IP_ALLOWLIST_GROUPS_YAML_GZ }}
          allowlist-version: ${{ vars.HMPPS_IP_ALLOWLIST_GROUPS_VERSION }}
          github-token: ${{ secrets.IP_ALLOWLISTS_GITHUB_TOKEN != '' && secrets.IP_ALLOWLISTS_GITHUB_TOKEN || github.token }}

      # ── Helm upgrade/install ─────────────────────────────────────────
      - name: Print Helm deployment details
        run: |
          echo "Helm release : ${{ steps.names.outputs.release }}"
          echo "Chart        : ${{ inputs.helm-dir }}/${{ steps.names.outputs.chart }}"
          echo "Namespace    : ${{ secrets.KUBE_NAMESPACE }}"
          echo "Values file  : ${{ inputs.helm-dir }}/values-${{ inputs.environment }}.yaml"
          echo "Image set    : ${{ steps.image-tag.outputs.set-arg }}=${{ inputs.app-version }}"
          echo "Timeout      : ${{ inputs.helm-timeout }}"
          echo "Extra args   : ${{ inputs.helm-additional-args }}"
          echo "Release vals : ${{ steps.release-values.outputs.flag }}"
          echo "Allowlist    : ${{ steps.allowlist.outputs.helm-args }}"
      - name: Helm upgrade
        run: |
          helm upgrade "${{ steps.names.outputs.release }}" \
            "${{ inputs.helm-dir }}/${{ steps.names.outputs.chart }}" \
            --install \
            --wait \
            --reset-values \
            --timeout "${{ inputs.helm-timeout }}" \
            --namespace "${{ secrets.KUBE_NAMESPACE }}" \
            --values "${{ inputs.helm-dir }}/values-${{ inputs.environment }}.yaml" \
            ${{ steps.allowlist.outputs.helm-args }} \
            ${{ steps.release-values.outputs.flag }} \
            --set "${{ steps.image-tag.outputs.set-arg }}=${{ inputs.app-version }}" \
            ${{ inputs.helm-additional-args }}

      # ── Slack notification (prod only) ───────────────────────────────
      # Matches CircleCI: slack_notification: true on prod deploys
      # Always sends to central dps-releases channel for production
      - name: Notify Slack — prod release (dps-releases)
        if: |
          always() &&
          (inputs.environment == 'prod' || inputs.environment == 'production')
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          payload: |
            channel: "CVA3MKDTR"
            text: "*${{ github.event.repository.name }}* version `${{ inputs.app-version }}` deployed to *${{ inputs.environment }}* — ${{ job.status == 'success' && ':white_check_mark:' || ':red_circle:' }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.event.repository.name }}* version `${{ inputs.app-version }}` deploy to *${{ inputs.environment }}*"
                accessory:
                  type: button
                  text:
                    type: plain_text
                    text: View run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "Deploy ${{ job.status }}"

      # Matches CircleCI: slack_notification: true + slack_channel_name param
      - name: Notify Slack — team channel
        if: always() && inputs.slack-notification == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          method: chat.postMessage
          token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ inputs.slack-channel }}"
            text: "*${{ github.event.repository.name }}* version `${{ inputs.app-version }}` deployed to *${{ inputs.environment }}* — ${{ job.status == 'success' && ':white_check_mark:' || ':red_circle:' }}"