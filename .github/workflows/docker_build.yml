name: Docker Build and Push

# Shared Docker build for Node and Java pipelines.
#
# CircleCI equivalents:
#   Node UIs (tools-ui, mi-ui, demo-ui): hmpps/build_docker → linux/amd64 only
#   Java (tools-api, mi): build_multiplatform_docker_job → linux/amd64,linux/arm64
#
# Callers pass `platforms`. Default is amd64-only (Node / orb parity). Java
# pipelines pass linux/amd64,linux/arm64. PR dry-runs (push=false) always
# force amd64 — multi-arch export needs a registry push.
#
# Registry: quay.io/hmpps/ → ghcr.io/ministryofjustice/
# App version format Build.<SHA> preserved for helm values.

on:
  workflow_call:
    inputs:
      dockerfile-dir:
        description: Directory containing the Dockerfile
        type: string
        default: '.'
      docker-registry:
        description: Container registry
        type: string
        default: 'ghcr.io'
      registry-org:
        description: Registry organisation
        type: string
        default: 'ministryofjustice'
      additional-docker-build-args:
        description: Extra docker buildx build arguments (e.g. --secret, --build-arg)
        type: string
        default: ''
      push:
        description: Whether to push the image (set false for dry-run)
        type: boolean
        default: true
      tag-latest:
        description: Also push the :latest tag (disable on feature/PR builds)
        type: boolean
        default: true
      extra-tags:
        description: Additional image tags, space or newline separated (e.g. release tag v1.0.3)
        type: string
        default: ''
      platforms:
        description: >
          Build platforms when push=true (e.g. linux/amd64 or linux/amd64,linux/arm64).
          Ignored when push=false — always linux/amd64 for PR dry-runs.
        type: string
        default: 'linux/amd64'
    secrets:
      # Optional. When set, mounted as BuildKit secret id=SENTRY_AUTH_TOKEN
      # for Dockerfiles that upload Sentry source maps (e.g. MI-UI).
      # Dockerfile should no-op when the secret is empty/absent.
      SENTRY_AUTH_TOKEN:
        required: false
    outputs:
      app-version:
        description: The app version tag that was built and pushed
        value: ${{ jobs.build.outputs.app_version }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      platforms: ${{ steps.platforms.outputs.platforms }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # ── App version ──────────────────────────────────────────────────
      # Matches CircleCI: mem/remember APP_VERSION = "Build.${CIRCLE_SHA1}"
      - name: Set app version
        id: version
        run: |
          APP_VERSION="Build.${{ github.sha }}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      # ── Platforms ────────────────────────────────────────────────────
      # push=false → amd64 only (CircleCI build_docker_test publish:false).
      # push=true  → caller platforms (Node amd64; Java multi-arch).
      - name: Resolve platforms
        id: platforms
        env:
          PUSH: ${{ inputs.push }}
          REQUESTED: ${{ inputs.platforms }}
        run: |
          if [ "${PUSH}" = "true" ]; then
            PLATFORMS="${REQUESTED:-linux/amd64}"
          else
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          if [[ "${PLATFORMS}" == *arm64* ]]; then
            echo "multi_arch=true" >> "$GITHUB_OUTPUT"
          else
            echo "multi_arch=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building platforms: ${PLATFORMS} (push=${PUSH})"

      # ── Docker registry login ────────────────────────────────────────
      # Matches CircleCI: docker login -u="${QUAYIO_USERNAME}" -p="${QUAYIO_PASSWORD}" quay.io
      # Changed: GHCR login using GITHUB_TOKEN (no separate credentials needed)
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx setup (QEMU only when arm64 is requested) ─────────────
      - name: Set up QEMU (multi-arch support)
        if: steps.platforms.outputs.multi_arch == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          platforms: ${{ steps.platforms.outputs.platforms }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ inputs.docker-registry }}/${{ inputs.registry-org }}/${{ github.event.repository.name }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG_LATEST: ${{ inputs.tag-latest }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${APP_VERSION}"
            if [ "${TAG_LATEST}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            for t in ${EXTRA_TAGS}; do
              echo "${IMAGE}:${t}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build and push ───────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.dockerfile-dir }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          pull: true
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            maintainer=dps-hmpps@digital.justice.gov.uk
            app.version=${{ steps.version.outputs.app_version }}
            build.version=${{ steps.version.outputs.app_version }}
            build.gitref=${{ github.sha }}
          build-args: |
            BUILD_NUMBER=${{ steps.version.outputs.app_version }}
            GIT_REF=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            ${{ inputs.additional-docker-build-args }}
          # BuildKit secret for Sentry source-map upload (CircleCI: --secret id=SENTRY_AUTH_TOKEN).
          # Empty token is fine — consumer Dockerfiles typically skip upload when unset.
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
