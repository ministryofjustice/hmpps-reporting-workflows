name: Frontend Java pipeline

# Orchestrator for Kotlin/Java Cloud Platform apps (e.g. MI API).
#
# Primary:    dev → {test, preprod} (parallel) → prod
# Probation:  optional preset (enable-probation) — same topology,
#             chart/env defaults live here; consumers may override.
#
# Nested uses: must be fully-qualified (caller-repo resolution). See
# docs/versioning.md.

on:
  workflow_call:
    inputs:
      # ── Build stack ──────────────────────────────────────────────────
      java-version:
        type: string
        default: '21'
      gradle-check-command:
        type: string
        default: 'check'
      cache-key-file:
        type: string
        default: 'build.gradle.kts'
      test-results-path:
        type: string
        default: 'build/test-results'
      reports-path:
        type: string
        default: 'build/reports/tests'

      # ── Docker ───────────────────────────────────────────────────────
      dockerfile-dir:
        type: string
        default: '.'
      docker-registry:
        type: string
        default: 'ghcr.io'
      registry-org:
        type: string
        default: 'ministryofjustice'

      # ── Helm / deploy shared ─────────────────────────────────────────
      helm-dir:
        type: string
        default: 'helm_deploy'
      helm-timeout:
        type: string
        default: '5m'
      slack-channel:
        type: string
        default: 'dpr_cicd_approvals'

      # ── Primary deployment (always) ──────────────────────────────────
      primary-chart-name:
        description: Defaults to the caller repo name when empty
        type: string
        default: ''
      primary-release-name:
        description: Defaults to primary-chart-name when empty
        type: string
        default: ''
      primary-dev-env:
        type: string
        default: 'dev'
      primary-test-env:
        type: string
        default: 'test'
      primary-preprod-env:
        type: string
        default: 'preprod'
      primary-prod-env:
        type: string
        default: 'prod'

      # ── Probation preset (optional named deployment) ─────────────────
      enable-probation:
        description: Deploy the probation Helm product alongside primary
        type: boolean
        default: false
      probation-chart-name:
        description: Override probation chart (Java default below)
        type: string
        default: 'hmpps-probation-mi-api'
      probation-release-name:
        type: string
        default: 'hmpps-probation-mi-api'
      probation-dev-env:
        type: string
        default: 'probation-dev'
      probation-test-env:
        type: string
        default: 'probation-test'
      probation-preprod-env:
        type: string
        default: 'probation-preprod'
      probation-prod-env:
        type: string
        default: 'probation-prod'

      # ── Promote / feature-branch behaviour ───────────────────────────
      deploy-ref:
        description: Full promote (test → prod, + probation) only on this ref
        type: string
        default: 'refs/heads/main'
      deploy-dev-on-feature-branches:
        description: Build image and deploy primary DEV on non-main branches
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  app_version:
    name: Set app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: echo "version=Build.${{ github.sha }}" >> "$GITHUB_OUTPUT"

  gradle_validate:
    name: Gradle validate
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/gradle_validate.yml@v1
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}
      gradle-check-command: ${{ inputs.gradle-check-command }}
      cache-key-file: ${{ inputs.cache-key-file }}
      test-results-path: ${{ inputs.test-results-path }}
      reports-path: ${{ inputs.reports-path }}

  helm_lint_primary:
    name: Helm lint primary (dev)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.primary-dev-env }}
      chart-name: ${{ inputs.primary-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_dev:
    name: Helm lint probation (dev)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.probation-dev-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_test:
    name: Helm lint probation (test)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.probation-test-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_preprod:
    name: Helm lint probation (preprod)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.probation-preprod-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_prod:
    name: Helm lint probation (prod)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.probation-prod-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  # Probation lint jobs are always listed in needs:; when enable-probation
  # is false they are skipped — treat skipped as OK for the build gate.
  build_docker:
    name: Build multi-arch Docker image
    if: |
      always() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-dev-on-feature-branches) &&
      needs.gradle_validate.result == 'success' &&
      needs.helm_lint_primary.result == 'success' &&
      needs.app_version.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_dev.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_preprod.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_prod.result)
    needs:
      - gradle_validate
      - helm_lint_primary
      - helm_lint_probation_dev
      - helm_lint_probation_test
      - helm_lint_probation_preprod
      - helm_lint_probation_prod
      - app_version
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/docker_build.yml@v1
    secrets: inherit
    with:
      dockerfile-dir: ${{ inputs.dockerfile-dir }}
      docker-registry: ${{ inputs.docker-registry }}
      registry-org: ${{ inputs.registry-org }}
      push: true
      tag-latest: ${{ github.ref == inputs.deploy-ref }}

  # ── Primary ──────────────────────────────────────────────────────────

  deploy_primary_dev:
    name: Deploy primary → dev
    if: |
      always() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-dev-on-feature-branches) &&
      needs.build_docker.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.primary-dev-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_primary_test:
    name: Deploy primary → test
    if: github.ref == inputs.deploy-ref
    needs: [deploy_primary_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.primary-test-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_primary_preprod:
    name: Deploy primary → preprod
    if: github.ref == inputs.deploy-ref
    needs: [deploy_primary_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.primary-preprod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_primary_prod:
    name: Deploy primary → prod
    if: github.ref == inputs.deploy-ref
    needs: [deploy_primary_preprod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.primary-prod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}

  # ── Probation preset (main only) ─────────────────────────────────────

  deploy_probation_dev:
    name: Deploy probation → probation-dev
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-probation &&
      needs.build_docker.result == 'success' &&
      needs.helm_lint_probation_dev.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, helm_lint_probation_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.probation-dev-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_test:
    name: Deploy probation → probation-test
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-probation &&
      needs.deploy_probation_dev.result == 'success' &&
      needs.helm_lint_probation_test.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_probation_dev, helm_lint_probation_test, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.probation-test-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_preprod:
    name: Deploy probation → probation-preprod
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-probation &&
      needs.deploy_probation_dev.result == 'success' &&
      needs.helm_lint_probation_preprod.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_probation_dev, helm_lint_probation_preprod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.probation-preprod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_prod:
    name: Deploy probation → probation-prod
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-probation &&
      needs.deploy_probation_preprod.result == 'success' &&
      needs.helm_lint_probation_prod.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_probation_preprod, helm_lint_probation_prod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.probation-prod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}
