name: Frontend Node pipeline

# Orchestrator for Node Cloud Platform apps (e.g. MI UI).
# Same primary + optional probation preset as frontend_java_pipeline;
# validate uses node_validate. Primary helm lint covers all four envs
# (matches MI-UI CircleCI). Nested uses must be fully-qualified.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      install-command:
        type: string
        default: 'npm run setup --no-audit'
      build-command:
        type: string
        default: 'npm run build'
      lint-command:
        type: string
        default: 'npm run lint'
      unit-test-command:
        type: string
        default: 'npm run test:ci'

      dockerfile-dir:
        type: string
        default: '.'
      docker-registry:
        type: string
        default: 'ghcr.io'
      registry-org:
        type: string
        default: 'ministryofjustice'
      additional-docker-build-args:
        type: string
        default: ''

      helm-dir:
        type: string
        default: 'helm_deploy'
      helm-timeout:
        type: string
        default: '5m'
      slack-channel:
        type: string
        default: 'dpr_cicd_approvals'

      primary-chart-name:
        type: string
        default: ''
      primary-release-name:
        type: string
        default: ''
      primary-dev-env:
        type: string
        default: 'dev'
      primary-test-env:
        type: string
        default: 'test'
      primary-preprod-env:
        type: string
        default: 'preprod'
      primary-prod-env:
        type: string
        default: 'prod'

      enable-probation:
        description: Deploy the probation Helm product alongside primary
        type: boolean
        default: false
      probation-chart-name:
        type: string
        default: 'hmpps-probation-mi-ui'
      probation-release-name:
        type: string
        default: 'hmpps-probation-mi-ui'
      probation-dev-env:
        type: string
        default: 'probation-dev'
      probation-test-env:
        type: string
        default: 'probation-test'
      probation-preprod-env:
        type: string
        default: 'probation-preprod'
      probation-prod-env:
        type: string
        default: 'probation-prod'

      deploy-ref:
        type: string
        default: 'refs/heads/main'
      deploy-dev-on-feature-branches:
        description: Build image and deploy primary + probation DEV on non-main branches
        type: boolean
        default: true
      deploy-test-on-feature-branches:
        description: Deploy primary + probation TEST on non-main branches
        type: boolean
        default: false
      deploy-preprod-on-feature-branches:
        description: Deploy primary + probation PREPROD on non-main branches
        type: boolean
        default: false
      deploy-preprod-prod:
        description: >-
          Run the pipeline's preprod/prod deploy jobs. Set false when preprod/prod
          are released only via the releases repo (stable GitHub Releases).
        type: boolean
        default: true

      # ── Release tag / GitHub Release ─────────────────────────────────
      enable-release-tag:
        description: >-
          deploy-ref builds: git tag vX.Y.Z (patch bump), image :vX.Y.Z and a
          GitHub Release with notes. Other branches: image-only RC label
          rc-<branch>-<run> (no git tag). Caller must grant `contents: write`.
        type: boolean
        default: false
      version-bump-strategy:
        description: >-
          conventional = version bump from Conventional Commits (feat -> minor,
          type! / BREAKING CHANGE -> major, else patch); patch = always patch
        type: string
        default: 'conventional'

      # ── Optional Sentry (primary deploys only; matches CircleCI MI-UI) ─
      enable-sentry:
        description: Patch Sentry RELEASE_GIT_SHA secret before primary Helm deploys
        type: boolean
        default: false
      sentry-secret-name:
        description: K8s secret name to patch (required when enable-sentry is true)
        type: string
        default: ''
      sentry-secret-key:
        description: Key within the secret to update
        type: string
        default: 'RELEASE_GIT_SHA'
      sentry-release-sha:
        description: Raw git SHA override; when empty, derived from app-version
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  app_version:
    name: Set app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      rc-label: ${{ steps.set.outputs.rc_label }}
    steps:
      - id: set
        env:
          BRANCH: ${{ github.ref_name }}
          IS_DEPLOY_REF: ${{ github.ref == inputs.deploy-ref }}
          ENABLE_RELEASE_TAG: ${{ inputs.enable-release-tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          RC_LABEL=""
          # Feature builds: image-only release-candidate label, no git tag.
          if [ "${ENABLE_RELEASE_TAG}" = "true" ] && [ "${IS_DEPLOY_REF}" != "true" ]; then
            SLUG=$(echo "${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-60 | sed -E 's/-+$//')
            RC_LABEL="rc-${SLUG}-${RUN_NUMBER}"
          fi
          {
            echo "version=Build.${GITHUB_SHA}"
            echo "rc_label=${RC_LABEL}"
          } >> "$GITHUB_OUTPUT"
          echo "### App version: \`Build.${GITHUB_SHA}\`${RC_LABEL:+, RC label: \`${RC_LABEL}\`}" >> "$GITHUB_STEP_SUMMARY"

  node_validate:
    name: Node validate
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/node_validate.yml@test/tag-based-releases
    secrets: inherit
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      lint-command: ${{ inputs.lint-command }}
      unit-test-command: ${{ inputs.unit-test-command }}

  helm_lint_primary_dev:
    name: Helm lint primary (dev)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.primary-dev-env }}
      chart-name: ${{ inputs.primary-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_primary_test:
    name: Helm lint primary (test)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.primary-test-env }}
      chart-name: ${{ inputs.primary-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_primary_preprod:
    name: Helm lint primary (preprod)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.primary-preprod-env }}
      chart-name: ${{ inputs.primary-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_primary_prod:
    name: Helm lint primary (prod)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.primary-prod-env }}
      chart-name: ${{ inputs.primary-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_dev:
    name: Helm lint probation (dev)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.probation-dev-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_test:
    name: Helm lint probation (test)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.probation-test-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_preprod:
    name: Helm lint probation (preprod)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.probation-preprod-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_probation_prod:
    name: Helm lint probation (prod)
    if: inputs.enable-probation
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@test/tag-based-releases
    with:
      environment: ${{ inputs.probation-prod-env }}
      chart-name: ${{ inputs.probation-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  # Same validate/lint gate as build_docker; tag is pushed before the image
  # build so both image tags (Build.<sha>, vX.Y.Z) land in one push.
  release_tag:
    name: Create release tag
    if: |
      always() &&
      inputs.enable-release-tag &&
      github.ref == inputs.deploy-ref &&
      needs.node_validate.result == 'success' &&
      needs.helm_lint_primary_dev.result == 'success' &&
      needs.helm_lint_primary_test.result == 'success' &&
      needs.helm_lint_primary_preprod.result == 'success' &&
      needs.helm_lint_primary_prod.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_dev.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_preprod.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_prod.result)
    needs:
      - node_validate
      - helm_lint_primary_dev
      - helm_lint_primary_test
      - helm_lint_primary_preprod
      - helm_lint_primary_prod
      - helm_lint_probation_dev
      - helm_lint_probation_test
      - helm_lint_probation_preprod
      - helm_lint_probation_prod
    permissions:
      contents: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/release_tag.yml@test/tag-based-releases
    with:
      bump-strategy: ${{ inputs.version-bump-strategy }}

  build_docker:
    name: Build multi-arch Docker image
    if: |
      always() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-dev-on-feature-branches) &&
      needs.node_validate.result == 'success' &&
      needs.helm_lint_primary_dev.result == 'success' &&
      needs.helm_lint_primary_test.result == 'success' &&
      needs.helm_lint_primary_preprod.result == 'success' &&
      needs.helm_lint_primary_prod.result == 'success' &&
      needs.app_version.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_dev.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_preprod.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_probation_prod.result) &&
      contains(fromJSON('["success","skipped"]'), needs.release_tag.result)
    needs:
      - node_validate
      - helm_lint_primary_dev
      - helm_lint_primary_test
      - helm_lint_primary_preprod
      - helm_lint_primary_prod
      - helm_lint_probation_dev
      - helm_lint_probation_test
      - helm_lint_probation_preprod
      - helm_lint_probation_prod
      - app_version
      - release_tag
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/docker_build.yml@test/tag-based-releases
    secrets: inherit
    with:
      dockerfile-dir: ${{ inputs.dockerfile-dir }}
      docker-registry: ${{ inputs.docker-registry }}
      registry-org: ${{ inputs.registry-org }}
      additional-docker-build-args: ${{ inputs.additional-docker-build-args }}
      push: true
      tag-latest: ${{ github.ref == inputs.deploy-ref }}
      # Stable tag on deploy-ref, image-only RC label elsewhere.
      extra-tags: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label }}

  # Published only once the image exists, so every Release is deployable.
  github_release:
    name: Publish GitHub Release
    if: |
      !cancelled() &&
      needs.release_tag.result == 'success' &&
      needs.build_docker.result == 'success' &&
      needs.release_tag.outputs.tag != ''
    needs: [release_tag, build_docker]
    permissions:
      contents: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/github_release.yml@test/tag-based-releases
    with:
      tag: ${{ needs.release_tag.outputs.tag }}
      previous-stable: ${{ needs.release_tag.outputs.previous-stable }}

  # ── Primary ──────────────────────────────────────────────────────────
  # app-version: stable tag (deploy-ref) or RC label (feature), else Build.<sha>
  # (same image). Sentry gets the raw commit SHA explicitly. Conditions use
  # !cancelled() + explicit upstream results: a plain `if:` implicitly requires
  # every ancestor to succeed, so skipped optional jobs skipped later deploys.

  deploy_primary_dev:
    name: Deploy primary → dev
    if: |
      !cancelled() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-dev-on-feature-branches) &&
      needs.build_docker.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.primary-dev-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'
      enable-sentry: ${{ inputs.enable-sentry }}
      sentry-secret-name: ${{ inputs.sentry-secret-name }}
      sentry-secret-key: ${{ inputs.sentry-secret-key }}
      sentry-release-sha: ${{ inputs.sentry-release-sha || github.sha }}

  deploy_primary_test:
    name: Deploy primary → test
    if: |
      !cancelled() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-test-on-feature-branches) &&
      needs.deploy_primary_dev.result == 'success'
    needs: [deploy_primary_dev, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.primary-test-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'
      enable-sentry: ${{ inputs.enable-sentry }}
      sentry-secret-name: ${{ inputs.sentry-secret-name }}
      sentry-secret-key: ${{ inputs.sentry-secret-key }}
      sentry-release-sha: ${{ inputs.sentry-release-sha || github.sha }}

  deploy_primary_preprod:
    name: Deploy primary → preprod
    if: |
      !cancelled() &&
      inputs.deploy-preprod-prod &&
      (github.ref == inputs.deploy-ref || inputs.deploy-preprod-on-feature-branches) &&
      needs.deploy_primary_dev.result == 'success'
    needs: [deploy_primary_dev, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.primary-preprod-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'
      enable-sentry: ${{ inputs.enable-sentry }}
      sentry-secret-name: ${{ inputs.sentry-secret-name }}
      sentry-secret-key: ${{ inputs.sentry-secret-key }}
      sentry-release-sha: ${{ inputs.sentry-release-sha || github.sha }}

  deploy_primary_prod:
    name: Deploy primary → prod
    if: |
      !cancelled() &&
      inputs.deploy-preprod-prod &&
      github.ref == inputs.deploy-ref &&
      needs.deploy_primary_preprod.result == 'success'
    needs: [deploy_primary_preprod, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.primary-prod-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.primary-chart-name }}
      release-name: ${{ inputs.primary-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}
      enable-sentry: ${{ inputs.enable-sentry }}
      sentry-secret-name: ${{ inputs.sentry-secret-name }}
      sentry-secret-key: ${{ inputs.sentry-secret-key }}
      sentry-release-sha: ${{ inputs.sentry-release-sha || github.sha }}

  # ── Probation preset (DEV also on feature branches when enabled) ─────

  deploy_probation_dev:
    name: Deploy probation → probation-dev
    if: |
      !cancelled() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-dev-on-feature-branches) &&
      inputs.enable-probation &&
      needs.build_docker.result == 'success' &&
      needs.helm_lint_probation_dev.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, helm_lint_probation_dev, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.probation-dev-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_test:
    name: Deploy probation → probation-test
    if: |
      !cancelled() &&
      (github.ref == inputs.deploy-ref || inputs.deploy-test-on-feature-branches) &&
      inputs.enable-probation &&
      needs.deploy_probation_dev.result == 'success' &&
      needs.helm_lint_probation_test.result == 'success'
    needs: [deploy_probation_dev, helm_lint_probation_test, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.probation-test-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_preprod:
    name: Deploy probation → probation-preprod
    if: |
      !cancelled() &&
      inputs.deploy-preprod-prod &&
      (github.ref == inputs.deploy-ref || inputs.deploy-preprod-on-feature-branches) &&
      inputs.enable-probation &&
      needs.deploy_probation_dev.result == 'success' &&
      needs.helm_lint_probation_preprod.result == 'success'
    needs: [deploy_probation_dev, helm_lint_probation_preprod, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.probation-preprod-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_probation_prod:
    name: Deploy probation → probation-prod
    if: |
      !cancelled() &&
      inputs.deploy-preprod-prod &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-probation &&
      needs.deploy_probation_preprod.result == 'success' &&
      needs.helm_lint_probation_prod.result == 'success'
    needs: [deploy_probation_preprod, helm_lint_probation_prod, app_version, release_tag]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.probation-prod-env }}
      app-version: ${{ needs.release_tag.outputs.tag || needs.app_version.outputs.rc-label || needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.probation-chart-name }}
      release-name: ${{ inputs.probation-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}
