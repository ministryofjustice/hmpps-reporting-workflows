name: Generic release pipeline

# Helm-only promote of an existing build. No validate / docker build — for
# delayed preprod/prod from a releases board.
#
# Preferred: release-tag (vX.Y.Z from release_tag.yml) — deploys image
# :vX.Y.Z with the Helm chart + values checked out at that tag. The caller is
# dispatched on main (GitHub Environment branch policies), only the checkout
# moves to the tag.
#
# Stable-only: environments not listed in `unprotected-environments` (i.e.
# preprod/prod) accept only a strict vX.Y.Z release-tag that has a published,
# non-prerelease GitHub Release. Unprotected (dev/test) may also use
# app-version (Build.<sha> or an rc-* label) with checkout-ref (commit SHA),
# e.g. to roll dev/test back to an earlier feature build.
#
# App stubs (e.g. MI-UI .github/workflows/release.yml) call this via
# workflow_call. digital-prison-reporting-releases dispatches those stubs.
# Does not use CircleCI hmpps-reporting-orb / generic_release.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (dev|test|preprod|prod|…)
        type: string
        required: true
      release-tag:
        description: App release tag to deploy (e.g. v1.0.3); image and chart both come from it
        type: string
        default: ''
      app-version:
        description: >-
          Existing image tag (Build.<sha> or rc-* label); ignored when release-tag
          is set. Only allowed for unprotected-environments.
        type: string
        default: ''
      checkout-ref:
        description: >-
          With app-version: commit SHA/ref to check out for chart + values
          (default: the dispatched ref). Only for unprotected-environments.
        type: string
        default: ''
      unprotected-environments:
        description: Space-separated environments that may deploy non-stable builds
        type: string
        default: 'dev test probation-dev probation-test'
      helm-chart-name:
        type: string
        default: ''
      release-name:
        type: string
        default: ''
      helm-dir:
        type: string
        default: 'helm_deploy'
      helm-timeout:
        type: string
        default: '5m'
      helm-additional-args:
        type: string
        default: ''
      release-values-yaml:
        description: Extra Helm values from releases config/values.yaml
        type: string
        default: ''
      verify-image:
        description: Fail if the GHCR image tag is missing
        type: boolean
        default: true
      docker-registry:
        type: string
        default: 'ghcr.io'
      registry-org:
        type: string
        default: 'ministryofjustice'
      slack-notification:
        type: string
        default: 'false'
      slack-channel:
        type: string
        default: 'dpr_cicd_approvals'
      # Sentry: same secret patch as the main pipeline's primary deploys.
      enable-sentry:
        type: boolean
        default: false
      sentry-secret-name:
        type: string
        default: ''
      sentry-secret-key:
        type: string
        default: 'RELEASE_GIT_SHA'
    # No `secrets:` block: KUBE_* are GitHub Environment secrets, only visible
    # to deploy_env's job (which sets `environment:`). Declaring them required
    # here fails the caller before any job runs. Callers use `secrets: inherit`.

permissions:
  contents: read
  packages: read

jobs:
  verify_tag:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      checkout-ref: ${{ steps.resolve.outputs.checkout_ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and verify
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          UNPROTECTED: ${{ inputs.unprotected-environments }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          APP_VERSION: ${{ inputs.app-version }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
        run: |
          set -euo pipefail
          PROTECTED=true
          for e in ${UNPROTECTED}; do
            [ "${e}" = "${ENVIRONMENT}" ] && PROTECTED=false
          done
          echo "Environment ${ENVIRONMENT}: protected=${PROTECTED}"

          if [ "${PROTECTED}" = "true" ]; then
            if [ -z "${RELEASE_TAG}" ]; then
              echo "::error::${ENVIRONMENT} only accepts release-tag (stable vX.Y.Z with a GitHub Release), not app-version"
              exit 1
            fi
            if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${ENVIRONMENT} only accepts stable vX.Y.Z tags, got '${RELEASE_TAG}'"
              exit 1
            fi
            # Drafts are not returned by this endpoint, so 404 covers missing + draft.
            if ! STATE=$(gh api "repos/${REPO}/releases/tags/${RELEASE_TAG}" --jq '"\(.draft) \(.prerelease)"' 2>/dev/null); then
              echo "::error::No published GitHub Release for ${RELEASE_TAG} in ${REPO}"
              exit 1
            fi
            if [ "${STATE}" != "false false" ]; then
              echo "::error::GitHub Release ${RELEASE_TAG} is a draft or prerelease (draft prerelease = ${STATE})"
              exit 1
            fi
          fi

          if [ -n "${RELEASE_TAG}" ]; then
            if ! gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "::error::Git tag not found in ${REPO}: ${RELEASE_TAG}"
              exit 1
            fi
            SHA=$(gh api "repos/${REPO}/commits/${RELEASE_TAG}" --jq .sha)
            echo "Release tag ${RELEASE_TAG} -> ${SHA}"
            {
              echo "version=${RELEASE_TAG}"
              echo "checkout_ref=${RELEASE_TAG}"
              echo "sha=${SHA}"
            } >> "$GITHUB_OUTPUT"
            echo "### Releasing \`${RELEASE_TAG}\` (${SHA}) to ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${APP_VERSION}" ]; then
            SHA=""
            if [ -n "${CHECKOUT_REF}" ]; then
              if ! SHA=$(gh api "repos/${REPO}/commits/${CHECKOUT_REF}" --jq .sha 2>/dev/null); then
                echo "::error::checkout-ref not found in ${REPO}: ${CHECKOUT_REF}"
                exit 1
              fi
            fi
            {
              echo "version=${APP_VERSION}"
              echo "checkout_ref=${CHECKOUT_REF}"
              echo "sha=${SHA}"
            } >> "$GITHUB_OUTPUT"
            echo "### Deploying \`${APP_VERSION}\`${SHA:+ (${SHA})} to ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Set release-tag (preferred) or app-version"
            exit 1
          fi

  verify_image:
    name: Verify image exists
    needs: [verify_tag]
    if: inputs.verify-image
    runs-on: ubuntu-latest
    steps:
      - name: Check GHCR tag
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.docker-registry }}/${{ inputs.registry-org }}/${{ github.event.repository.name }}:${{ needs.verify_tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Checking image: ${IMAGE}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "::error::Image not found in registry: ${IMAGE}"
            echo "Build and push this tag from the app pipeline before promoting."
            exit 1
          fi
          echo "Image found."

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: [verify_tag, verify_image]
    if: |
      always() &&
      needs.verify_tag.result == 'success' &&
      (needs.verify_image.result == 'success' || needs.verify_image.result == 'skipped')
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      app-version: ${{ needs.verify_tag.outputs.version }}
      checkout-ref: ${{ needs.verify_tag.outputs.checkout-ref }}
      helm-chart-name: ${{ inputs.helm-chart-name }}
      release-name: ${{ inputs.release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      helm-additional-args: ${{ inputs.helm-additional-args }}
      release-values-yaml: ${{ inputs.release-values-yaml }}
      show-changelog: true
      slack-notification: ${{ inputs.slack-notification }}
      slack-channel: ${{ inputs.slack-channel }}
      enable-sentry: ${{ inputs.enable-sentry }}
      sentry-secret-name: ${{ inputs.sentry-secret-name }}
      sentry-secret-key: ${{ inputs.sentry-secret-key }}
      # Empty only for app-version without checkout-ref: deploy_env then derives
      # it from a Build.<sha> app-version (rc-* labels need checkout-ref).
      sentry-release-sha: ${{ needs.verify_tag.outputs.sha }}
