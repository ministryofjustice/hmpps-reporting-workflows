name: Node pipeline (dual-track)

# Dual-track build/deploy for Node Cloud Platform apps (MI-UI Phase 2).
# Mirrors reporting_pipeline.yml topology; validate uses node_validate
# instead of gradle_validate. Track-1 helm lint covers all four envs
# (matches hmpps-circleci-orb usage in MI-UI CircleCI config).
#
# Nested uses: must be fully-qualified (see reporting_pipeline.yml header).
# Integration tests, acceptance tests, and Sentry secret updates are not
# in this first cut — add as follow-up reusable workflows/actions.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      install-command:
        type: string
        default: 'npm run setup --no-audit'
      build-command:
        type: string
        default: 'npm run build'
      lint-command:
        type: string
        default: 'npm run lint'
      unit-test-command:
        type: string
        default: 'npm run test:ci'

      dockerfile-dir:
        type: string
        default: '.'
      docker-registry:
        type: string
        default: 'ghcr.io'
      registry-org:
        type: string
        default: 'ministryofjustice'
      additional-docker-build-args:
        type: string
        default: ''

      helm-dir:
        type: string
        default: 'helm_deploy'
      helm-timeout:
        type: string
        default: '5m'
      slack-channel:
        type: string
        default: 'dpr_cicd_approvals'

      track1-chart-name:
        type: string
        default: ''
      track1-release-name:
        type: string
        default: ''
      track1-dev-env:
        type: string
        default: 'dev'
      track1-test-env:
        type: string
        default: 'test'
      track1-preprod-env:
        type: string
        default: 'preprod'
      track1-prod-env:
        type: string
        default: 'prod'

      enable-track2:
        type: boolean
        default: true
      track2-chart-name:
        type: string
        default: 'hmpps-probation-mi-ui'
      track2-release-name:
        type: string
        default: 'hmpps-probation-mi-ui'
      track2-dev-env:
        type: string
        default: 'probation-dev'
      track2-test-env:
        type: string
        default: 'probation-test'
      track2-preprod-env:
        type: string
        default: 'probation-preprod'
      track2-prod-env:
        type: string
        default: 'probation-prod'

      deploy-ref:
        type: string
        default: 'refs/heads/main'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  app_version:
    name: Set app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: echo "version=Build.${{ github.sha }}" >> "$GITHUB_OUTPUT"

  node_validate:
    name: Node validate
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/node_validate.yml@v1
    secrets: inherit
    with:
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      build-command: ${{ inputs.build-command }}
      lint-command: ${{ inputs.lint-command }}
      unit-test-command: ${{ inputs.unit-test-command }}

  # Track 1 — lint all envs (MI-UI CircleCI shape)
  helm_lint_track1_dev:
    name: Helm lint track 1 (dev)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track1-dev-env }}
      chart-name: ${{ inputs.track1-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track1_test:
    name: Helm lint track 1 (test)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track1-test-env }}
      chart-name: ${{ inputs.track1-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track1_preprod:
    name: Helm lint track 1 (preprod)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track1-preprod-env }}
      chart-name: ${{ inputs.track1-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track1_prod:
    name: Helm lint track 1 (prod)
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track1-prod-env }}
      chart-name: ${{ inputs.track1-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track2_dev:
    name: Helm lint track 2 (dev)
    if: inputs.enable-track2
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track2-dev-env }}
      chart-name: ${{ inputs.track2-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track2_test:
    name: Helm lint track 2 (test)
    if: inputs.enable-track2
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track2-test-env }}
      chart-name: ${{ inputs.track2-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track2_preprod:
    name: Helm lint track 2 (preprod)
    if: inputs.enable-track2
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track2-preprod-env }}
      chart-name: ${{ inputs.track2-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  helm_lint_track2_prod:
    name: Helm lint track 2 (prod)
    if: inputs.enable-track2
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/helm_lint.yml@v1
    with:
      environment: ${{ inputs.track2-prod-env }}
      chart-name: ${{ inputs.track2-chart-name }}
      helm-dir: ${{ inputs.helm-dir }}

  build_docker:
    name: Build multi-arch Docker image
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      needs.node_validate.result == 'success' &&
      needs.helm_lint_track1_dev.result == 'success' &&
      needs.helm_lint_track1_test.result == 'success' &&
      needs.helm_lint_track1_preprod.result == 'success' &&
      needs.helm_lint_track1_prod.result == 'success' &&
      needs.app_version.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_track2_dev.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_track2_test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_track2_preprod.result) &&
      contains(fromJSON('["success","skipped"]'), needs.helm_lint_track2_prod.result)
    needs:
      - node_validate
      - helm_lint_track1_dev
      - helm_lint_track1_test
      - helm_lint_track1_preprod
      - helm_lint_track1_prod
      - helm_lint_track2_dev
      - helm_lint_track2_test
      - helm_lint_track2_preprod
      - helm_lint_track2_prod
      - app_version
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/docker_build.yml@v1
    secrets: inherit
    with:
      dockerfile-dir: ${{ inputs.dockerfile-dir }}
      docker-registry: ${{ inputs.docker-registry }}
      registry-org: ${{ inputs.registry-org }}
      additional-docker-build-args: ${{ inputs.additional-docker-build-args }}
      push: true

  deploy_track1_dev:
    name: Deploy track 1 → dev
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      needs.build_docker.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track1-dev-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track1-chart-name }}
      release-name: ${{ inputs.track1-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track1_test:
    name: Deploy track 1 → test
    if: github.ref == inputs.deploy-ref
    needs: [deploy_track1_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track1-test-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track1-chart-name }}
      release-name: ${{ inputs.track1-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track1_preprod:
    name: Deploy track 1 → preprod
    if: github.ref == inputs.deploy-ref
    needs: [deploy_track1_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track1-preprod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track1-chart-name }}
      release-name: ${{ inputs.track1-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track1_prod:
    name: Deploy track 1 → prod
    if: github.ref == inputs.deploy-ref
    needs: [deploy_track1_preprod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track1-prod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track1-chart-name }}
      release-name: ${{ inputs.track1-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}

  deploy_track2_dev:
    name: Deploy track 2 → probation-dev
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-track2 &&
      needs.build_docker.result == 'success' &&
      needs.helm_lint_track2_dev.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [build_docker, helm_lint_track2_dev, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track2-dev-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track2-chart-name }}
      release-name: ${{ inputs.track2-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track2_test:
    name: Deploy track 2 → probation-test
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-track2 &&
      needs.deploy_track2_dev.result == 'success' &&
      needs.helm_lint_track2_test.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_track2_dev, helm_lint_track2_test, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track2-test-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track2-chart-name }}
      release-name: ${{ inputs.track2-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track2_preprod:
    name: Deploy track 2 → probation-preprod
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-track2 &&
      needs.deploy_track2_dev.result == 'success' &&
      needs.helm_lint_track2_preprod.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_track2_dev, helm_lint_track2_preprod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track2-preprod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track2-chart-name }}
      release-name: ${{ inputs.track2-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'false'

  deploy_track2_prod:
    name: Deploy track 2 → probation-prod
    if: |
      always() &&
      github.ref == inputs.deploy-ref &&
      inputs.enable-track2 &&
      needs.deploy_track2_preprod.result == 'success' &&
      needs.helm_lint_track2_prod.result == 'success' &&
      needs.app_version.result == 'success'
    needs: [deploy_track2_preprod, helm_lint_track2_prod, app_version]
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/deploy_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.track2-prod-env }}
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: ${{ inputs.track2-chart-name }}
      release-name: ${{ inputs.track2-release-name }}
      helm-dir: ${{ inputs.helm-dir }}
      helm-timeout: ${{ inputs.helm-timeout }}
      slack-notification: 'true'
      slack-channel: ${{ inputs.slack-channel }}
