name: PR checks

# Reusable PR checks for Gradle (MI) and Node (MI-UI) stacks.
# Thin caller: .github/workflows/pull-request.yml

on:
  workflow_call:
    inputs:
      stack:
        description: Build stack — gradle or node
        type: string
        default: 'gradle'
      java-version:
        description: JDK version for gradle stack
        type: string
        default: '21'
      java-distribution:
        description: JDK distribution for gradle stack
        type: string
        default: 'corretto'
      ktlint-task:
        description: Gradle task that auto-fixes lint issues
        type: string
        default: 'ktlintFormat'
      jacoco-task:
        description: Gradle task that produces the coverage summary
        type: string
        default: 'jacocoTestReport'
      node-version:
        description: Node version for node stack
        type: string
        default: '24'
      install-command:
        type: string
        default: 'npm run setup --no-audit'
      unit-test-command:
        description: Node unit test command (coverage comment greps % Stmts)
        type: string
        default: 'npm run test'
      coverage-grep:
        description: grep pattern for the PR coverage comment body
        type: string
        default: '% Stmts'
      require-conventional-title:
        description: >-
          Fail the PR unless its title is a Conventional Commit
          ("type(scope)!: summary"). With squash merges the title drives the
          release version bump (feat -> minor, ! -> major, else patch).
        type: boolean
        default: false

permissions: {}

jobs:
  pr_title:
    name: PR title (Conventional Commits)
    if: inputs.require-conventional-title && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          TYPES='feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert|deps'
          RE="^(${TYPES})(\([a-zA-Z0-9._/-]+\))?!?: .+"
          if [[ "${TITLE}" =~ ${RE} ]]; then
            case "${TITLE}" in
              *'!:'*) BUMP="major" ;;
              feat*)  BUMP="minor" ;;
              *)      BUMP="patch" ;;
            esac
            echo "OK: '${TITLE}' -> ${BUMP} release on merge"
            echo "### PR title OK, merging gives a **${BUMP}** version bump" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::PR title must follow Conventional Commits: '<type>(<scope>)!: <summary>'"
            echo "::error::types: ${TYPES//|/, } — e.g. 'feat(reports): add export', 'fix: null check', 'feat!: drop v1 API'"
            echo "::error::got: '${TITLE}'"
            exit 1
          fi

  checks:
    name: PR checks
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # ── Gradle ───────────────────────────────────────────────────────
      - name: Set up JDK ${{ inputs.java-version }}
        if: inputs.stack == 'gradle'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Setup Gradle
        if: inputs.stack == 'gradle'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Add linting fixes
        if: inputs.stack == 'gradle'
        run: ./gradlew ${{ inputs.ktlint-task }}

      - name: Calculate test coverage (Gradle)
        if: inputs.stack == 'gradle'
        id: calculate-test-coverage-gradle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew ${{ inputs.jacoco-task }} > logs.txt
          gh pr comment ${{ github.event.pull_request.number }} --body "$(grep 'Test Coverage:' logs.txt -A6)"

      # ── Node ─────────────────────────────────────────────────────────
      - name: Setup Node and npm
        if: inputs.stack == 'node'
        uses: ministryofjustice/hmpps-reporting-actions/actions/setup-node-npm@71d35a95ebf19b07902d646d04014a8b5228e2a4 # v1.0.5
        with:
          node-version: ${{ inputs.node-version }}
          install-command: ${{ inputs.install-command }}

      - name: Calculate test coverage (Node)
        if: inputs.stack == 'node'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ inputs.unit-test-command }} > logs.txt
          gh pr comment ${{ github.event.pull_request.number }} --body "$(grep '${{ inputs.coverage-grep }}' logs.txt -A2)"
