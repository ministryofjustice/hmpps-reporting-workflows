name: Release tag

# Creates the app release tag (vX.Y.Z) on the commit being built, so a
# release can later be pinned by tag (image :vX.Y.Z + chart/values at the tag)
# instead of by Build.<sha>.
#
# Bumps the highest existing <prefix>X.Y.Z tag (initial-version when none).
# bump-strategy conventional (default) reads Conventional Commits since that
# tag: "type!:" / "BREAKING CHANGE:" -> major, "feat:" -> minor, else patch.
# App tags are independent of the Lib-v* tags created by bump_version, which
# mirror the shared library version.
#
# Caller must grant `contents: write` (tag push uses GITHUB_TOKEN). Tags pushed
# with GITHUB_TOKEN do not trigger further workflow runs.

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: Prefix for app release tags
        type: string
        default: 'v'
      initial-version:
        description: Version used when no prefixed X.Y.Z tag exists yet
        type: string
        default: '1.0.0'
      bump-strategy:
        description: >-
          conventional = bump from Conventional Commits since the previous
          stable tag (feat -> minor, type! / BREAKING CHANGE -> major, else
          patch); patch = always patch
        type: string
        default: 'conventional'
    outputs:
      tag:
        description: The release tag on this commit (e.g. v1.0.3)
        value: ${{ jobs.tag.outputs.tag }}
      previous-stable:
        description: The stable tag before this one (empty for the first release)
        value: ${{ jobs.tag.outputs.previous-stable }}
      bump:
        description: major | minor | patch | initial | existing (re-run)
        value: ${{ jobs.tag.outputs.bump }}

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    # No `concurrency:` here: GitHub cancels older *pending* runs in a group,
    # which would drop a main build's tag. Racing builds are handled by the
    # retry loop instead (pushing an existing tag name is rejected).
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      previous-stable: ${{ steps.tag.outputs.previous_stable }}
      bump: ${{ steps.tag.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute and push tag
        id: tag
        env:
          PREFIX: ${{ inputs.tag-prefix }}
          INITIAL: ${{ inputs.initial-version }}
          STRATEGY: ${{ inputs.bump-strategy }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GLOB="${PREFIX}[0-9]*.[0-9]*.[0-9]*"
          STRICT="^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$"
          TAG=""
          BUMP=""

          # Conventional Commits since $1: subject "type(scope)!:" or a
          # "BREAKING CHANGE:" footer -> major; subject "feat:" -> minor;
          # anything else -> patch.
          bump_from_commits() {
            local range="$1..HEAD" subjects bodies
            subjects=$(git log --format=%s "${range}")
            bodies=$(git log --format=%b "${range}")
            if grep -qE '^[A-Za-z]+(\([^)]*\))?!:' <<< "${subjects}" \
              || grep -qE '^[[:space:]]*BREAKING[ -]CHANGE:' <<< "${bodies}"; then
              echo "major"
            elif grep -qiE '^feat(\([^)]*\))?:' <<< "${subjects}"; then
              echo "minor"
            else
              echo "patch"
            fi
          }

          for attempt in 1 2 3 4 5; do
            git fetch --force --tags --quiet origin

            # Re-run of the same commit: reuse its existing tag.
            EXISTING=$(git tag --points-at HEAD -l "${GLOB}" --sort=-v:refname | grep -E "${STRICT}" | head -n1 || true)
            if [ -n "${EXISTING}" ]; then
              TAG="${EXISTING}"
              BUMP="existing"
              echo "Commit already tagged: ${TAG}"
              break
            fi

            LATEST=$(git tag -l "${GLOB}" --sort=-v:refname | grep -E "${STRICT}" | head -n1 || true)
            if [ -z "${LATEST}" ]; then
              BUMP="initial"
              CANDIDATE="${PREFIX}${INITIAL}"
            else
              if [ "${STRATEGY}" = "conventional" ]; then
                BUMP=$(bump_from_commits "${LATEST}")
              else
                BUMP="patch"
              fi
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#"${PREFIX}"}"
              case "${BUMP}" in
                major) CANDIDATE="${PREFIX}$((MAJOR + 1)).0.0" ;;
                minor) CANDIDATE="${PREFIX}${MAJOR}.$((MINOR + 1)).0" ;;
                *)     CANDIDATE="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              esac
            fi

            echo "Latest: ${LATEST:-none} -> candidate: ${CANDIDATE} (${BUMP}, strategy ${STRATEGY}, attempt ${attempt})"
            git tag -a "${CANDIDATE}" -m "Release ${CANDIDATE}" HEAD
            if git push origin "refs/tags/${CANDIDATE}"; then
              TAG="${CANDIDATE}"
              break
            fi

            git tag -d "${CANDIDATE}"
            sleep $((attempt * 3))
          done

          if [ -z "${TAG}" ]; then
            echo "::error::Could not create a release tag after 5 attempts"
            exit 1
          fi

          # Next-lower strict tag, used as the release-notes start point.
          PREVIOUS=$(git tag -l "${GLOB}" --sort=-v:refname | grep -E "${STRICT}" \
            | awk -v t="${TAG}" 'found { print; exit } $0 == t { found = 1 }' || true)

          {
            echo "tag=${TAG}"
            echo "previous_stable=${PREVIOUS}"
            echo "bump=${BUMP}"
          } >> "$GITHUB_OUTPUT"
          echo "### Release tag: \`${TAG}\` (${BUMP}) on ${GITHUB_SHA}, previous: \`${PREVIOUS:-none}\`" >> "$GITHUB_STEP_SUMMARY"
