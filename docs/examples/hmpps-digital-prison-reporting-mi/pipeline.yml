name: Pipeline [validate -> build -> deploy]

# ============================================================================
# Example pipeline for: hmpps-digital-prison-reporting-mi
# ============================================================================
# This file lives in the CONSUMING REPO at:
#   .github/workflows/pipeline.yml
#
# It replaces the CircleCI build-test-and-deploy workflow defined in:
#   .circleci/config.yml
#
# CIRCLECI → GHA MAPPING
# ─────────────────────────────────────────────────────────────────────────────
# CircleCI job / concept              GHA equivalent
# ─────────────────────────────────────────────────────────────────────────────
# validate                            gradle_validate (reusable workflow)
# hmpps/helm_lint (×5)                helm_lint (reusable workflow, called ×5)
# build_multiplatform_docker_job      docker_build (reusable workflow)
# mem/remember APP_VERSION            app_version job output
# hmpps/deploy_env (×8)              deploy_env (reusable workflow, called ×8)
# type: approval (×6)                 GitHub Environment required reviewers
# circleci/slack notifications        built into deploy_env workflow
# CircleCI context: hmpps-common-vars GitHub Environment secrets (auto-populated
#                 + per-env contexts  by Cloud Platform Terraform module)
#
# TWO PARALLEL DEPLOYMENT TRACKS
# ─────────────────────────────────────────────────────────────────────────────
# Track 1 — Main MI API (chart: hmpps-digital-prison-reporting-mi)
#   dev → [approval] → test → [approval] → preprod → [approval] → prod
#
# Track 2 — Probation MI API (chart: hmpps-probation-mi-api)
#   probation-dev → [approval] → probation-test
#                → [approval] → probation-preprod → [approval] → probation-prod
#
# APPROVAL GATES
# ─────────────────────────────────────────────────────────────────────────────
# CircleCI used `type: approval` jobs between environments.
# GHA uses GitHub Environment required reviewers — when a job targets an
# environment that has required reviewers configured, GHA pauses automatically.
# No extra approval step is needed in the YAML.
#
# Set required reviewers via Cloud Platform Terraform:
#   reviewer_teams = ["your-github-team"]
# on environments: test, preprod, prod, probation-test, probation-preprod,
#                  probation-prod
#
# DOCKER REGISTRY CHANGE
# ─────────────────────────────────────────────────────────────────────────────
# CircleCI: quay.io/hmpps/hmpps-digital-prison-reporting-mi
# GHA:      ghcr.io/ministryofjustice/hmpps-digital-prison-reporting-mi
#
# Update in helm_deploy/values.yaml:
#   image:
#     repository: ghcr.io/ministryofjustice/hmpps-digital-prison-reporting-mi
#
# PREREQUISITES
# ─────────────────────────────────────────────────────────────────────────────
# 1. Cloud Platform Terraform PR raised and merged — populates GitHub
#    Environments with KUBE_CERT, KUBE_CLUSTER, KUBE_NAMESPACE, KUBE_TOKEN
# 2. GitHub Environments created (matching names below):
#    dev, test, preprod, prod
#    probation-dev, probation-test, probation-preprod, probation-prod
# 3. Required reviewers set on: test, preprod, prod,
#    probation-test, probation-preprod, probation-prod
# 4. HMPPS_SRE_SLACK_BOT_TOKEN set as org/repo secret
# 5. NONPROD_RELEASES_SLACK_CHANNEL and PROD_RELEASES_SLACK_CHANNEL
#    set as repo variables (replaces CircleCI pipeline parameters)
# ============================================================================

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Cancel in-progress runs on non-main branches when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # ── App version ───────────────────────────────────────────────────────────
  # Replaces CircleCI: mem/remember APP_VERSION = "Build.${CIRCLE_SHA1}"
  # Used by docker_build output, then passed to all deploy_env calls
  app_version:
    name: Set app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: echo "version=Build.${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── Gradle validate ───────────────────────────────────────────────────────
  # Replaces CircleCI job: validate
  # Runs on ALL branches (matches CircleCI filters: tags: ignore: /.*/  )
  gradle_validate:
    name: Gradle validate
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/gradle_validate.yml@main
    secrets: inherit
    with:
      java-version: '21'
      gradle-check-command: 'check'
      cache-key-file: 'build.gradle.kts'
      test-results-path: 'build/test-results'
      reports-path: 'build/reports/tests'

  # ── Helm lint — main MI chart (dev) ──────────────────────────────────────
  # Replaces CircleCI: hmpps/helm_lint  (no extra params → uses repo name, dev)
  helm_lint:
    name: Helm lint (dev)
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/helm_lint.yml@main
    with:
      environment: dev
      # chart-name defaults to github.event.repository.name → hmpps-digital-prison-reporting-mi

  # ── Helm lint — probation MI API chart ───────────────────────────────────
  # Replaces CircleCI:
  #   hmpps/helm_lint: chart_name: hmpps-probation-mi-api, env: probation-dev
  #   hmpps/helm_lint: chart_name: hmpps-probation-mi-api, env: probation-test
  #   hmpps/helm_lint: chart_name: hmpps-probation-mi-api, env: probation-preprod
  #   hmpps/helm_lint: chart_name: hmpps-probation-mi-api, env: probation-prod
  helm_lint_probation_dev:
    name: Helm lint probation (probation-dev)
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/helm_lint.yml@main
    with:
      environment: probation-dev
      chart-name: hmpps-probation-mi-api

  helm_lint_probation_test:
    name: Helm lint probation (probation-test)
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/helm_lint.yml@main
    with:
      environment: probation-test
      chart-name: hmpps-probation-mi-api

  helm_lint_probation_preprod:
    name: Helm lint probation (probation-preprod)
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/helm_lint.yml@main
    with:
      environment: probation-preprod
      chart-name: hmpps-probation-mi-api

  helm_lint_probation_prod:
    name: Helm lint probation (probation-prod)
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/helm_lint.yml@main
    with:
      environment: probation-prod
      chart-name: hmpps-probation-mi-api

  # ── Docker build ──────────────────────────────────────────────────────────
  # Replaces CircleCI job: build_multiplatform_docker_job
  # Only runs on main branch (matches CircleCI filters: branches: only: [main])
  # Requires all helm lints and validate to pass first
  build_docker:
    name: Build multi-arch Docker image
    if: github.ref == 'refs/heads/main'
    needs:
      - gradle_validate
      - helm_lint
      - helm_lint_probation_dev
      - helm_lint_probation_test
      - helm_lint_probation_preprod
      - helm_lint_probation_prod
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/docker_build.yml@main
    secrets: inherit
    with:
      dockerfile-dir: '.'
      docker-registry: 'ghcr.io'
      registry-org: 'ministryofjustice'
      push: true

  # ═══════════════════════════════════════════════════════════════════════════
  # TRACK 1: MAIN MI API DEPLOYMENTS
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Deploy → dev ──────────────────────────────────────────────────────────
  # Replaces CircleCI: hmpps/deploy_env name: deploy_dev env: "dev"
  # No approval needed before dev
  deploy_dev:
    name: Deploy to dev
    if: github.ref == 'refs/heads/main'
    needs:
      - build_docker
      - gradle_validate
      - helm_lint
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: dev
      app-version: ${{ needs.app_version.outputs.version }}
      release-name: PROJECT_NAME_ENV_NAME
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → test ─────────────────────────────────────────────────────────
  # Replaces CircleCI: request-test-approval (type: approval) + deploy_test
  # Approval gate: GitHub Environment "test" must have required reviewers set
  deploy_test:
    name: Deploy to test
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_dev
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: test
      app-version: ${{ needs.app_version.outputs.version }}
      release-name: PROJECT_NAME_ENV_NAME
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → preprod ──────────────────────────────────────────────────────
  # Replaces CircleCI: request-preprod-approval (type: approval) + deploy_preprod
  # Approval gate: GitHub Environment "preprod" must have required reviewers set
  deploy_preprod:
    name: Deploy to preprod
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_dev
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: preprod
      app-version: ${{ needs.app_version.outputs.version }}
      release-name: PROJECT_NAME_ENV_NAME
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → prod ─────────────────────────────────────────────────────────
  # Replaces CircleCI: request-prod-approval (type: approval) + deploy_prod
  # Approval gate: GitHub Environment "prod" must have required reviewers set
  # Slack notification enabled — matches CircleCI slack_notification: true
  deploy_prod:
    name: Deploy to prod
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_preprod
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: prod
      app-version: ${{ needs.app_version.outputs.version }}
      release-name: PROJECT_NAME_ENV_NAME
      helm-timeout: 5m
      slack-notification: 'true'
      slack-channel: dpr_cicd_approvals

  # ═══════════════════════════════════════════════════════════════════════════
  # TRACK 2: PROBATION MI API DEPLOYMENTS
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Deploy → probation-dev ────────────────────────────────────────────────
  # Replaces CircleCI: hmpps/deploy_env name: deploy_probation_dev
  # No approval before probation-dev
  deploy_probation_dev:
    name: Deploy to probation-dev
    if: github.ref == 'refs/heads/main'
    needs:
      - build_docker
      - gradle_validate
      - helm_lint_probation_dev
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: probation-dev
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: hmpps-probation-mi-api
      release-name: hmpps-probation-mi-api
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → probation-test ───────────────────────────────────────────────
  # Replaces CircleCI: request-probation-test-approval + deploy_probation_test
  # Approval gate: GitHub Environment "probation-test" must have required reviewers
  deploy_probation_test:
    name: Deploy to probation-test
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_probation_dev
      - helm_lint_probation_test
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: probation-test
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: hmpps-probation-mi-api
      release-name: hmpps-probation-mi-api
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → probation-preprod ────────────────────────────────────────────
  # Replaces CircleCI: request-probation-preprod-approval + deploy_probation_preprod
  # Approval gate: GitHub Environment "probation-preprod" must have required reviewers
  deploy_probation_preprod:
    name: Deploy to probation-preprod
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_probation_dev
      - helm_lint_probation_preprod
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: probation-preprod
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: hmpps-probation-mi-api
      release-name: hmpps-probation-mi-api
      helm-timeout: 5m
      slack-notification: 'false'

  # ── Deploy → probation-prod ───────────────────────────────────────────────
  # Replaces CircleCI: request-probation-prod-approval + deploy_probation_prod
  # Approval gate: GitHub Environment "probation-prod" must have required reviewers
  # Slack notification enabled — matches CircleCI slack_notification: true
  deploy_probation_prod:
    name: Deploy to probation-prod
    if: github.ref == 'refs/heads/main'
    needs:
      - deploy_probation_preprod
      - helm_lint_probation_prod
      - app_version
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/deploy_env.yml@main
    secrets: inherit
    with:
      environment: probation-prod
      app-version: ${{ needs.app_version.outputs.version }}
      helm-chart-name: hmpps-probation-mi-api
      release-name: hmpps-probation-mi-api
      helm-timeout: 5m
      slack-notification: 'true'
      slack-channel: dpr_cicd_approvals
