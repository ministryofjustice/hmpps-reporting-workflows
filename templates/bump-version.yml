# ============================================================================
# Copy-paste starter: bump shared dependency version
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/bump-version.yml
#
# Apps pin this reusable workflow at @v1 only. Composite action SHAs
# (checkout, setup-node-npm, bump-version) live in
# hmpps-reporting-workflows/.github/workflows/bump_version.yml — never
# call hmpps-reporting-actions from an app stub.
# ============================================================================

name: Bump version

on:
  workflow_dispatch:

jobs:
  bump:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/bump_version.yml@v1
    secrets: inherit
    with:
      # gradle → Maven reporting-lib; node → npm reporting-frontend (+ SLSA)
      stack: gradle
      # Optional overrides (defaults match MI / MI-UI presets):
      # node-version: '24'
      # npm-package: '@ministryofjustice/hmpps-digital-prison-reporting-frontend'
      # run-slsa: true
      # resolve-command: ''   # shell that prints version on stdout
      # apply-command: ''     # use $VERSION for the resolved version
      # files-to-commit: ''
