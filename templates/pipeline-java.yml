# ============================================================================
# Copy-paste starter: Java / Kotlin Cloud Platform app
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/pipeline.yml
#
# For Node apps use templates/pipeline-node.yml instead.
# ============================================================================

name: Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/frontend_java_pipeline.yml@v1
    secrets: inherit
    with:
      # Flip on for MI-style dual product (prison + probation).
      # Chart/env defaults live in the workflow; override only if needed.
      enable-probation: false
      # Optional tag-based releases: main builds get git tag vX.Y.Z + image
      # tag + GitHub Release; feature builds get image label rc-<branch>-<run>.
      # Also set `contents: write` in permissions above:
      # enable-release-tag: true
      # Version bump from Conventional Commits (default) or always patch:
      # version-bump-strategy: conventional
      # Release preprod/prod only via the releases repo (stable Releases):
      # deploy-preprod-prod: false
      slack-channel: 'dpr_cicd_approvals'
