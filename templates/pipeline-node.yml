# ============================================================================
# Copy-paste starter: Node Cloud Platform app
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/pipeline.yml
# ============================================================================

name: Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/frontend_node_pipeline.yml@v1
    secrets: inherit
    with:
      enable-probation: false
      slack-channel: 'dpr_cicd_approvals'
