# ============================================================================
# Copy-paste starter: pull-request thin caller
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/pull-request.yml
#
# Set stack: gradle | node
# ============================================================================

name: Pull request

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  checks:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/pr_checks.yml@v1
    secrets: inherit
    with:
      stack: gradle
      java-version: '21'
      java-distribution: 'corretto'
      # Require Conventional Commit PR titles ("feat(scope): …"); with squash
      # merges the title drives the release version bump:
      # require-conventional-title: true
