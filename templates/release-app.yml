# ============================================================================
# Copy-paste starter: helm-only release of an app release tag (vX.Y.Z)
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/release.yml
#
# Dispatched on main by the releases repo (or manually). Deploys image :vX.Y.Z
# with the Helm chart + values checked out at that tag. Tags and GitHub
# Releases come from the pipeline (enable-release-tag: true).
#
# preprod/prod: release-tag only, and it must have a published, non-prerelease
# GitHub Release. dev/test may also use app-version (Build.<sha> / rc-* label)
# + checkout-ref (commit SHA), e.g. to roll back to an earlier feature build.
# ============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match a GitHub Environment)
        type: choice
        options:
          - dev
          - test
          - preprod
          - prod
        required: true
      release-tag:
        description: Stable app release tag (e.g. v1.0.3)
        type: string
        required: false
        default: ''
      app-version:
        description: dev/test only, instead of release-tag (Build.<sha> or rc-* label)
        type: string
        required: false
        default: ''
      checkout-ref:
        description: dev/test only, with app-version (commit SHA for chart + values)
        type: string
        required: false
        default: ''
      helm-chart-name:
        description: Chart to deploy (default = repo name)
        type: string
        required: false
        default: ''
      release-name:
        description: Helm release name (default = chart name)
        type: string
        required: false
        default: ''
      release-values-yaml:
        description: Optional extra Helm values YAML (from releases config/)
        type: string
        required: false
        default: ''
      verify-image:
        description: Verify GHCR image exists before deploy
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  release:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/generic_release_pipeline.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      release-tag: ${{ inputs.release-tag }}
      app-version: ${{ inputs.app-version }}
      checkout-ref: ${{ inputs.checkout-ref }}
      helm-chart-name: ${{ inputs.helm-chart-name }}
      release-name: ${{ inputs.release-name }}
      release-values-yaml: ${{ inputs.release-values-yaml }}
      verify-image: ${{ inputs.verify-image }}
      slack-channel: 'dpr_cicd_approvals'
      # If the pipeline uses enable-sentry, mirror it so releases patch the
      # Sentry release SHA too (resolved from the tag's commit):
      # enable-sentry: true
      # sentry-secret-name: your-app-sentry
