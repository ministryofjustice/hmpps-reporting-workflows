# ============================================================================
# Copy-paste starter: helm-only release of an app release tag (vX.Y.Z)
# ============================================================================
# Copy into the consuming repo as:
#   .github/workflows/release.yml
#
# Dispatched on main by digital-prison-reporting-releases (or manually).
# Deploys image :vX.Y.Z with the Helm chart + values checked out at that tag.
# Tags come from the pipeline (enable-release-tag: true).
# ============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match a GitHub Environment)
        type: choice
        options:
          - preprod
          - prod
          - test
          - dev
        required: true
      release-tag:
        description: App release tag (e.g. v1.0.3)
        type: string
        required: true
      release-values-yaml:
        description: Optional extra Helm values YAML (from releases config/)
        type: string
        required: false
        default: ''
      verify-image:
        description: Verify GHCR image exists before deploy
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  release:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/generic_release_pipeline.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      release-tag: ${{ inputs.release-tag }}
      release-values-yaml: ${{ inputs.release-values-yaml }}
      verify-image: ${{ inputs.verify-image }}
      slack-channel: 'dpr_cicd_approvals'
      # If the pipeline uses enable-sentry, mirror it so releases patch the
      # Sentry release SHA too (resolved from the tag's commit):
      # enable-sentry: true
      # sentry-secret-name: your-app-sentry
