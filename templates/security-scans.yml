# ============================================================================
# Copy-paste starter: security scan thin callers
# ============================================================================
# Copy the jobs relevant to this repo's stack into separate files under
# .github/workflows/ in the consuming repo (one file per scan, matching the
# names below), OR keep them combined here if the repo prefers a single
# scheduled workflow file — GHA does not require 1:1 file-per-scan.
#
# All scans proxy through hmpps-reporting-workflows so consuming repos never
# reference ministryofjustice/hmpps-github-actions directly. Pin @vX to a
# released tag, see docs/versioning.md.
# ============================================================================

# ---- security_codeql_actions.yml -------------------------------------------
on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * MON-FRI" # Every weekday

jobs:
  security-codeql-actions-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/HMPPS-REPORTING-WORKFLOWS/.github/workflows/security_codeql_actions.yml@v1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

